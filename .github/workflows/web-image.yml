name: web-image
# Manual: test, build and publish the TERMA web image when a release is wanted.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p . && npx eslint . && npx vitest run
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/amd64
          build-args: REVISION=${{ github.sha }}
          tags: ghcr.io/rafaelrnzo/terma-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "Deploy ghcr.io/rafaelrnzo/terma-web@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
